name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://shop:shop@localhost:5432/shop_test
      DATABASE_URL: postgresql+asyncpg://shop:shop@localhost:5432/shop_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff pip-audit
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
      - name: Lint (включая правила безопасности bandit)
        run: ruff check app tests alembic
      - name: Migrations apply cleanly and match models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests (на настоящем PostgreSQL)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Tests — demo mode
        run: flutter test --dart-define=APP_MODE=demo test/demo
      - name: Tests — release mode (API подменён)
        run: flutter test test/release
      - name: Build admin (магазин — HTML с бэкенда, собирать не нужно)
        run: flutter build web -t lib/main_admin.dart -o build/admin --release --no-web-resources-cdn --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: admin-web
          path: frontend/build/admin
